<style>
/* Layout: a working blueprint site — sticky stage tabs, one page per stage, every detail folded into collapsible rows */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --ink:#18231f; --muted:#5b6862; --line:#dde2dc;
  --accent:#0f6a66; --accent-soft:#e2efec; --gate:#9a6409; --gate-soft:#f8eed9; --risk:#a6402c; --risk-soft:#f6e3de;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --ink:#e7ece8; --muted:#9aa8a1; --line:#2a3531;
  --accent:#5cc3b8; --accent-soft:#16312d; --gate:#e2ad4f; --gate-soft:#33290f; --risk:#e58a74; --risk-soft:#3a1d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --ink:#e7ece8; --muted:#9aa8a1; --line:#2a3531;
  --accent:#5cc3b8; --accent-soft:#16312d; --gate:#e2ad4f; --gate-soft:#33290f; --risk:#e58a74; --risk-soft:#3a1d16; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,40px);line-height:1.1}
h2{font-size:clamp(26px,4vw,34px);line-height:1.12}
h3{font-size:19px;line-height:1.25}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:70ch;font-size:16px}
.muted{color:var(--muted)}

/* Site header */
.site{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding-bottom:14px}
.site .brand{display:grid;gap:2px}
.site .brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.overall{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-bottom:28px}
.tab{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:10px 12px 9px;display:grid;gap:1px;text-align:left;
  border-bottom:2px solid transparent;white-space:nowrap;font:inherit}
.tab .tn{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tab .tl{font-size:14px;font-weight:500}
.tab .tp{font-family:var(--mono);font-size:10.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .tn{color:var(--accent)}

.page{display:grid;gap:22px}

/* Stage header */
.shdr{display:grid;gap:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:4px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:3px;min-width:0}
.fact b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fact span{font-size:14px}
.fact.g{background:var(--gate-soft);border-color:transparent}
.fact.g b{color:var(--gate)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}
.legend .l-doc::before{background:var(--accent)} .legend .l-sop::before{background:var(--gate)} .legend .l-asset::before{background:var(--muted)}
button.small{font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button.small:hover{border-color:var(--accent)}

.group{display:grid;gap:8px}
.ghead{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}

/* Collapsible rows */
.row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.row input{width:18px;height:18px;margin:17px 0 0 4px;accent-color:var(--accent);cursor:pointer}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
.chev{width:9px;height:9px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
details.fold[open]>summary .chev{transform:rotate(45deg)}
.sumt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0}
.sumt strong{font-weight:600;font-size:15px}
.owner{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.counts{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.foldbody{padding:2px 16px 16px 37px;display:grid;gap:12px}
details.fold[open]>summary{border-bottom:1px dashed var(--line)}
details.fold[open] .foldbody{padding-top:12px}
.row.done strong{text-decoration:line-through;color:var(--muted)}
details.fold.gatefold{background:var(--gate-soft);border-color:transparent}
details.fold.gatefold strong{color:var(--gate)}
details.fold.ref>summary strong{font-family:var(--display);font-size:17px;font-weight:600}

.kits{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kit{border-left:2px solid var(--line);padding:2px 0 2px 10px;min-width:0}
.kit h5{margin:0 0 3px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kit.doc{border-color:var(--accent)} .kit.sop{border-color:var(--gate)} .kit.asset{border-color:var(--muted)}
.kit ul,.foldbody ul{margin:0;padding-left:17px;font-size:14px}
.kit li{margin:1px 0}
.desc{font-size:14.5px;color:var(--muted);max-width:78ch}

/* Tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
td ul{margin:0;padding-left:16px;font-size:13.5px}
.freq{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.sev{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.sev.h{background:var(--risk-soft);color:var(--risk)} .sev.m{background:var(--gate-soft);color:var(--gate)}

/* Entity structure */
.stack{display:grid}
.layer{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ent{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0;background:var(--bg)}
.ent.key{border-color:var(--accent)}
.ent .tag{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ent h4{margin:0;font-size:15px}
.ent ul{color:var(--muted);font-size:13px}
.link{display:flex;align-items:center;gap:10px;padding:7px 0 7px 22px;font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.link::before{content:"";width:1px;height:24px;background:var(--accent);margin-left:-12px;flex:none}

/* Overview */
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.principles div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.principles b{display:block;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.principles span{font-size:14px}
.gantt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto}
.ginner{min-width:620px;display:grid;gap:7px}
.grow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.grow .gl{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gl button{all:unset;cursor:pointer;color:var(--ink)}
.grow .gl button:hover{color:var(--accent);text-decoration:underline}
.gtrack{position:relative;height:18px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.gbar{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--accent);opacity:.85}
.gbar.open{background:repeating-linear-gradient(45deg,var(--accent) 0 6px,transparent 6px 10px);opacity:.6}
.gaxis{display:grid;grid-template-columns:150px 1fr;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.gaxis div:last-child{display:flex;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.card .cn{font-family:var(--display);font-size:28px;line-height:1;color:var(--accent)}
.card .ct{font-weight:600;font-size:15.5px}
.card .cw{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.card .cg{font-size:13px;color:var(--muted)}
.card .cp{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.card .cp .bar{width:70px}

.pager{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager button{all:unset;cursor:pointer;display:grid;gap:2px;max-width:48%}
.pager button:hover .pt{color:var(--accent)}
.pager .pk{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pager .pt{font-weight:600}
.pager .next{text-align:right;margin-left:auto}
.note{font-size:13px;color:var(--muted);max-width:80ch}

@media (max-width:560px){
  .foldbody{padding-left:16px}
  .grow{grid-template-columns:110px 1fr}
  .gaxis{grid-template-columns:110px 1fr}
  .bar{width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- state ---------- */
const KEY="isai-roadmap-v2"; let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sid=(st,i)=>`${st.id}-${i}`;
function stageDone(st){return st.steps.filter((_,i)=>state[sid(st,i)]).length}

/* ---------- render ---------- */
const PAGES=[{id:"overview",short:"Overview"},...STAGES];
const tabs=document.getElementById("tabs"), pages=document.getElementById("pages");

tabs.innerHTML=PAGES.map((p,i)=>`<button class="tab" role="tab" id="tab-${p.id}" data-go="${p.id}" aria-controls="page-${p.id}">
  <span class="tn">${i===0?"START":"STAGE "+i}</span><span class="tl">${esc(p.short)}</span><span class="tp" data-tp="${p.id}"></span></button>`).join("");

function kit(cls,label,items){return items.length?`<div class="kit ${cls}"><h5>${label}</h5><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
function plural(n,w){return `${n} ${w}${n===1?"":"s"}`}
function pager(i){
  const prev=PAGES[i-1], next=PAGES[i+1];
  return `<div class="pager">${prev?`<button data-go="${prev.id}"><span class="pk">← Previous</span><span class="pt">${esc(prev.title||prev.short)}</span></button>`:""}
  ${next?`<button class="next" data-go="${next.id}"><span class="pk">Next →</span><span class="pt">${esc(next.title)}</span></button>`:""}</div>`;
}

function overviewHTML(){
  const pct=v=>(v/24*100).toFixed(2);
  return `<section class="page" id="page-overview" role="tabpanel" aria-labelledby="tab-overview">
   <div class="shdr"><div class="eyebrow">Start here</div><h2>Eight stages from readiness to scale</h2>
    <p class="lede">Each stage has its own page. Steps sit in collapsible rows showing the owner and how many documents, SOPs and assets they need; open a row for the detail. No stage starts until the previous gate is met. Tick steps as they close; progress stays in this browser.</p></div>
   <div class="principles">
    <div><b>Own</b><span>Brand and curriculum IP stay with you and AST.</span></div>
    <div><b>License</b><span>Content and brand go to the network under revocable licences.</span></div>
    <div><b>Operate elsewhere</b><span>The partner's SPV and franchisees carry operations and its risk.</span></div>
    <div><b>Ring-fence</b><span>Government-funded NSDC work sits in a separate entity.</span></div>
   </div>
   <div class="group"><div class="ghead"><span>Timeline · months from go-ahead</span><span>Hatched = continues</span></div>
    <div class="gantt"><div class="ginner">
     ${STAGES.map(s=>`<div class="grow"><div class="gl"><button data-go="${s.id}">${esc(s.title)}</button></div><div class="gtrack"><span class="gbar${s.open?" open":""}" style="left:${pct(s.start)}%;width:${pct(s.end-s.start)}%" title="${esc(s.when)}"></span></div></div>`).join("")}
     <div class="gaxis"><div></div><div><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
    </div></div></div>
   <div class="group"><div class="ghead"><span>Stages</span></div>
    <div class="cards">${STAGES.map((s,i)=>`<button class="card" data-go="${s.id}"><span class="cn">${i+1}</span><span class="ct">${esc(s.title)}</span><span class="cw">${esc(s.when)} · ${esc(s.lead)}</span><span class="cg">${esc(s.goal.split(". ")[0])}.</span><span class="cp"><span class="bar"><i data-cb="${s.id}"></i></span><span data-cc="${s.id}"></span></span></button>`).join("")}</div></div>
   <div class="group"><div class="ghead"><span>Reference</span></div>
    <details class="fold ref"><summary><span class="chev"></span><span class="sumt"><strong>Critical path: every gate in order</strong></span><span class="counts">${STAGES.reduce((a,s)=>a+s.gate.length,0)} conditions</span></summary>
     <div class="foldbody">${STAGES.map((s,i)=>`<div><b>${i+1}. ${esc(s.title)}</b><ul>${s.gate.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div>`).join("")}</div></details>
    <details class="fold ref"><summary><span class="chev"></span><span class="sumt"><strong>Entity structure at a glance</strong></span><span class="counts">5 entities</span></summary><div class="foldbody">${STRUCTURE}</div></details>
   </div>
   <p class="note">This roadmap is a planning tool, not legal advice. Have a corporate or franchise lawyer and a CA confirm entity choices, agreements and tax treatment, and confirm NSDC and NASSCOM terms in writing.</p>
   ${pager(0)}
  </section>`;
}

function stageHTML(s,i){
  return `<section class="page" id="page-${s.id}" role="tabpanel" aria-labelledby="tab-${s.id}" hidden>
   <div class="shdr"><div class="eyebrow">Stage ${i} of ${STAGES.length} · ${esc(s.when)}</div><h2>${esc(s.title)}</h2><p class="lede">${esc(s.goal)}</p>
    <div class="facts"><div class="fact"><b>Lead</b><span>${esc(s.lead)}</span></div><div class="fact"><b>Starts when</b><span>${esc(s.entry)}</span></div><div class="fact g"><b>Done when</b><span>${esc(s.gate[0])}${s.gate.length>1?` + ${s.gate.length-1} more`:""}</span></div></div></div>
   <div class="toolbar"><div class="legend"><span class="l-doc">Documents</span><span class="l-sop">SOPs</span><span class="l-asset">Assets</span></div>
    <div style="display:flex;gap:8px"><button class="small" data-expand="${s.id}">Expand all</button><button class="small" data-collapse="${s.id}">Collapse all</button></div></div>
   <div class="group"><div class="ghead"><span>Steps</span><span data-sc="${s.id}"></span></div>
    ${s.steps.map((st,k)=>{const id=sid(s,k),on=!!state[id];return `<div class="row${on?" done":""}"><input type="checkbox" id="${id}" ${on?"checked":""} aria-label="Mark done: ${esc(st.t)}">
     <details class="fold"><summary><span class="chev"></span><span class="sumt"><strong>${esc(st.t)}</strong><span class="owner">${esc(st.o)}</span></span><span class="counts">${[st.docs.length&&plural(st.docs.length,"doc"),st.sops.length&&plural(st.sops.length,"SOP"),st.assets.length&&plural(st.assets.length,"asset")].filter(Boolean).join(" · ")}</span></summary>
      <div class="foldbody"><p class="desc">${esc(st.d)}</p><div class="kits">${kit("doc","Documents",st.docs)}${kit("sop","SOPs",st.sops)}${kit("asset","Assets",st.assets)}</div></div></details></div>`}).join("")}
   </div>
   <div class="group"><div class="ghead"><span>Gate</span></div>
    <details class="fold gatefold"><summary><span class="chev"></span><span class="sumt"><strong>Exit gate · conditions to move on</strong></span><span class="counts">${plural(s.gate.length,"condition")}</span></summary><div class="foldbody"><ul>${s.gate.map(g=>`<li>${esc(g)}</li>`).join("")}</ul></div></details>
   </div>
   ${s.refs.length?`<div class="group"><div class="ghead"><span>Reference</span></div>${s.refs.map(r=>`<details class="fold ref"><summary><span class="chev"></span><span class="sumt"><strong>${esc(r.t)}</strong></span><span></span></summary><div class="foldbody">${r.html}</div></details>`).join("")}</div>`:""}
   ${pager(i)}
  </section>`;
}
pages.innerHTML=overviewHTML()+STAGES.map((s,i)=>stageHTML(s,i+1)).join("");

/* ---------- progress ---------- */
function refresh(){
  let all=0,done=0;
  STAGES.forEach(s=>{const d=stageDone(s),n=s.steps.length;all+=n;done+=d;
    const t=`${d}/${n}`;
    document.querySelector(`[data-tp="${s.id}"]`).textContent=t+" done";
    document.querySelector(`[data-sc="${s.id}"]`).textContent=t+" done";
    document.querySelector(`[data-cc="${s.id}"]`).textContent=t+" steps";
    document.querySelector(`[data-cb="${s.id}"]`).style.width=(d/n*100)+"%";});
  document.querySelector(`[data-tp="overview"]`).textContent=`${done}/${all} done`;
  document.getElementById("allText").textContent=`${done} / ${all} steps`;
  document.getElementById("allBar").style.width=(all?done/all*100:0)+"%";
}
pages.addEventListener("change",e=>{
  if(e.target.type!=="checkbox")return;
  const id=e.target.id; if(e.target.checked)state[id]=1; else delete state[id];
  e.target.closest(".row").classList.toggle("done",e.target.checked); save(); refresh();
});

/* ---------- routing ---------- */
const IDS=PAGES.map(p=>p.id);
function show(id,scroll){
  if(!IDS.includes(id))id="overview";
  IDS.forEach(p=>{document.getElementById("page-"+p).hidden=p!==id;
    const t=document.getElementById("tab-"+p);t.setAttribute("aria-selected",p===id?"true":"false");t.tabIndex=p===id?0:-1;});
  const at=document.getElementById("tab-"+id); at.scrollIntoView({block:"nearest",inline:"nearest"});
  if(scroll)window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();const id=g.dataset.go;try{history.replaceState(null,"","#"+id)}catch(_){}show(id,true);return}
  const ex=e.target.closest("[data-expand]"),co=e.target.closest("[data-collapse]");
  if(ex||co){const pg=document.getElementById("page-"+(ex||co).dataset[ex?"expand":"collapse"]);pg.querySelectorAll("details.fold").forEach(d=>d.open=!!ex)}
});
tabs.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const cur=IDS.indexOf(document.querySelector('.tab[aria-selected="true"]').dataset.go);
  const n=IDS[(cur+(e.key==="ArrowRight"?1:-1)+IDS.length)%IDS.length];show(n,false);document.getElementById("tab-"+n).focus();
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1),true));
show(location.hash.slice(1),false);
refresh();
</script>
